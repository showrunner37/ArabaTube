plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arabatube.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arabatube.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // Sabit imza: her derlemede aynı anahtar → güncellemeyi kaldırmadan kurabilirsin
    signingConfigs {
        debug {
            storeFile file('arabatube.keystore')
            storePassword 'arabatube'
            keyAlias 'arabatube'
            keyPassword 'arabatube'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Resmi olmayan Android Auto SDK (CarActivity). CI'da otomatik indirilir.
    implementation files('libs/aauto.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
